      }, [applications]);

        setServices(prev => prev.map(s => s.id === id ? { ...s, active: s.active === false ? true : false } : s));

      const handleToggleFeatured = (id) => {
        setServices(prev => prev.map(s => s.id === id ? { ...s, featured: !s.featured } : s));
        showToast('Featured status updated');
      };

      const handleDeleteService = (id) => {
        if (confirm('Are you sure you want to delete this service record?')) {
          setServices(prev => prev.filter(s => s.id !== id));
          showToast('Service deleted');
        }
      };

      const handleSaveService = (formData) => {
        if (serviceToEdit) {
          setServices(prev => prev.map(s => s.id === formData.id ? formData : s));
          showToast(`Service "${formData.name}" updated successfully!`);
        } else {
          if (services.some(s => s.id === formData.id)) {
            alert('A service with this ID already exists.');
            return;
          }
          setServices(prev => [formData, ...prev]);
          showToast(`New service "${formData.name}" added!`);
        }
        setIsFormModalOpen(false);
      };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(services, null, 2));

        a.href = dataStr;
        a.download = `maa_enterprises_services_${new Date().toISOString().slice(0,10)}.json`;

        showToast('Catalog exported to JSON');

          if (serviceStatusFilter === 'inactive') matchStatus = s.active === false;
          if (serviceStatusFilter === 'featured') matchStatus = !!s.featured;

            (s.id && s.id.toLowerCase().includes(term)) ||
            (s.shortDescription && s.shortDescription.toLowerCase().includes(term)) ||
            (s.keywords && s.keywords.some(k => k.toLowerCase().includes(term)))

          return matchCat && matchStatus && matchSearch;

                      <Badge variant="indigo" className="mb-2">Admin Hub Live</Badge>
                      <h2 className="text-xl sm:text-2xl font-bold text-white">Cyber Cafe Operations Center</h2>
                      <p className="text-xs sm:text-sm text-slate-400 mt-1">Full control over services, online recruitment forms, RTPS applications, and notices.</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setCurrentTab('services')} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium cursor-pointer">Manage Services</button>
                      <button onClick={() => { setServiceToEdit(null); setIsFormModalOpen(true); }} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium cursor-pointer">+ Add New</button>
                    </div>
                  </div>

                  {/* KPI Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div onClick={() => setCurrentTab('services')} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 cursor-pointer transition-all">
                      <div className="flex justify-between items-center text-slate-400 text-xs font-semibold uppercase">
                        <span>Total Services</span>
                        <div className="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center"><Icons.Briefcase /></div>
                      </div>
                      <div className="text-2xl font-bold text-white mt-2">{services.length}</div>
                      <div className="text-xs text-emerald-400 mt-1">{services.filter(s => s.active !== false).length} Active in Catalog</div>
                    </div>

                    <div onClick={() => setCurrentTab('applications')} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 hover:border-amber-500/50 cursor-pointer transition-all">
                      <div className="flex justify-between items-center text-slate-400 text-xs font-semibold uppercase">
                        <span>Applications</span>
                        <div className="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center"><Icons.Clipboard /></div>
                      </div>
                      <div className="text-2xl font-bold text-white mt-2">{applications.length}</div>
                      <div className="text-xs text-amber-400 mt-1">{pendingCount} Pending Review</div>
                    </div>

                    <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800">
                      <div className="flex justify-between items-center text-slate-400 text-xs font-semibold uppercase">
                        <span>Active Notices</span>
                        <div className="w-8 h-8 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center"><Icons.Bell /></div>
                      </div>
                      <div className="text-2xl font-bold text-white mt-2">{notices.filter(n => n.active).length}</div>
                      <div className="text-xs text-cyan-400 mt-1">Homepage alerts live</div>
                    </div>
                  </div>

                  {/* Recent Applications Snapshot */}
                  <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-base font-bold text-white">Recent Customer Applications</h3>
                      <button onClick={() => setCurrentTab('applications')} className="text-xs text-indigo-400 hover:underline cursor-pointer">View All →</button>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="text-slate-400 border-b border-slate-800 pb-2">
                          <tr>
                            <th className="py-2">Token</th>
                            <th className="py-2">Customer</th>
                            <th className="py-2">Service</th>
                            <th className="py-2">Status</th>
                            <th className="py-2 text-right">Fee</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-slate-300">
                          {applications.map(app => (
                            <tr key={app.id} className="hover:bg-slate-800/40">
                              <td className="py-2.5 font-mono text-indigo-300 font-semibold">{app.trackingId}</td>
                              <td className="py-2.5 font-medium text-white">{app.customerName}</td>
                              <td className="py-2.5 truncate max-w-[200px]">{app.serviceName}</td>
                              <td className="py-2.5"><Badge variant={app.status === 'Completed' ? 'emerald' : 'amber'}>{app.status}</Badge></td>
                              <td className="py-2.5 text-right font-semibold text-emerald-400">₹{app.fee}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. SERVICES CATALOG */}
              {currentTab === 'services' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-5 rounded-2xl bg-slate-900/80 border border-slate-800">
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-xl font-bold text-white">Dynamic Services Catalog</h2>
                        <Badge variant="indigo">{services.length} Services</Badge>
                      </div>
                      <p className="text-xs text-slate-400 mt-0.5">Edit all service details, required documents, pricing, and active status.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={handleExportJSON} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-1.5 cursor-pointer">
                        <Icons.Download /> Export JSON
                      </button>
                      <button onClick={() => { setServiceToEdit(null); setIsFormModalOpen(true); }} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                        <Icons.Plus /> + Add Service
                      </button>
                    </div>
                  </div>

                  {/* Search and Category Filter */}
                  <div className="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 space-y-3">
                    <div className="flex flex-col sm:flex-row gap-3 justify-between items-center">
                      <div className="relative w-full sm:max-w-md">
                        <input
                          type="text"
                          value={serviceSearch}
                          onChange={(e) => setServiceSearch(e.target.value)}
                          placeholder="Search by name, ID, or keyword..."
                          className="w-full pl-4 pr-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                        {['all', 'active', 'inactive', 'featured'].map(st => (
                          <button
                            key={st}
                            onClick={() => setServiceStatusFilter(st)}
                            className={`px-3 py-1 rounded-lg capitalize font-medium cursor-pointer ${serviceStatusFilter === st ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                          >
                            {st}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                      {INITIAL_CATEGORIES.map(cat => {
                        const isSel = selectedCategory === cat;
                        const count = cat === 'All Services' ? services.length : services.filter(s => s.category === cat).length;
                        return (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-xl shrink-0 font-medium flex items-center gap-1.5 cursor-pointer ${
                              isSel ? 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/50' : 'bg-slate-950/60 text-slate-400 border border-slate-800'
                            }`}
                          >
                            <span>{cat}</span>
                            <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-300">{count}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Services Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    {filteredServices.map(service => {
                      const isActive = service.active !== false;
                      const isFeatured = !!service.featured;
                      return (
                        <div key={service.id} className={`p-5 rounded-2xl bg-slate-900/80 border flex flex-col justify-between shadow-xl ${isActive ? 'border-slate-800' : 'border-slate-800/40 opacity-70'}`}>
                          <div>
                            <div className="flex justify-between items-start mb-2">
                              <Badge variant="indigo" className="truncate max-w-[180px]">{service.category || 'General'}</Badge>
                              <div className="flex items-center gap-2">
                                <button
                                  onClick={() => handleToggleFeatured(service.id)}
                                  className={`p-1 rounded cursor-pointer ${isFeatured ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'}`}
                                  title="Toggle Featured"
                                >
                                  <Icons.Star filled={isFeatured} />
                                </button>
                                <button
                                  onClick={() => handleToggleActive(service.id)}
                                  className={`text-[10px] px-2 py-0.5 rounded-full font-semibold cursor-pointer ${isActive ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`}
                                >
                                  {isActive ? 'Active' : 'Disabled'}
                                </button>
                              </div>
                            </div>

                            <h3 onClick={() => setViewingService(service)} className="text-base font-bold text-white hover:text-indigo-300 cursor-pointer line-clamp-1">
                              {service.name}
                            </h3>
                            <div className="font-mono text-[10px] text-slate-400 mt-0.5">ID: {service.id}</div>
                            <p className="text-xs text-slate-400 mt-2 line-clamp-2">{service.shortDescription || service.description}</p>

                            <div className="flex justify-between items-center mt-4 pt-3 border-t border-slate-800 text-xs">
                              <span className="text-emerald-400 font-bold">{service.fee ? `₹${service.fee}` : 'Govt / Nominal'}</span>
                              <span className="text-slate-400 text-[11px]">{service.processingTime || '1-2 Days'}</span>
                            </div>
                          </div>

                          <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                            <button onClick={() => setViewingService(service)} className="text-xs text-slate-400 hover:text-white cursor-pointer">
                              View Details
                            </button>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() => { setServiceToEdit(service); setIsFormModalOpen(true); }}
                                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-1 cursor-pointer"
                              >
                                <Icons.Edit /> Edit
                              </button>
                              <button
                                onClick={() => handleDeleteService(service.id)}
                                className="p-1 text-slate-400 hover:text-rose-400 cursor-pointer"
                                title="Delete"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 3. APPLICATIONS */}
              {currentTab === 'applications' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="flex justify-between items-center p-5 rounded-2xl bg-slate-900/80 border border-slate-800">
                    <div>
                      <h2 className="text-xl font-bold text-white">Customer Form Applications</h2>
                      <p className="text-xs text-slate-400 mt-0.5">Manage customer job & certificate requests.</p>
                    </div>
                  </div>

                  <div className="rounded-2xl bg-slate-900/80 border border-slate-800 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4">Token</th>
                          <th className="py-3 px-4">Applicant</th>
                          <th className="py-3 px-4">Service</th>
                          <th className="py-3 px-4">Fee</th>
                          <th className="py-3 px-4">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {applications.map(app => (
                          <tr key={app.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 font-mono text-indigo-300 font-semibold">{app.trackingId}</td>
                            <td className="py-3 px-4">
                              <div className="font-semibold text-white">{app.customerName}</div>
                              <div className="text-[10px] text-slate-400">{app.phone}</div>
                            </td>
                            <td className="py-3 px-4 max-w-[200px] truncate">{app.serviceName}</td>
                            <td className="py-3 px-4 font-semibold text-emerald-400">₹{app.fee}</td>
                            <td className="py-3 px-4">
                              <select
                                value={app.status}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setApplications(prev => prev.map(a => a.id === app.id ? { ...a, status: val } : a));
                                  showToast('Status updated');
                                }}
                                className="text-xs bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 cursor-pointer"
                              >
                                <option value="Pending">Pending</option>
                                <option value="Under Review">Under Review</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 4. NOTICES */}
              {currentTab === 'notices' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800">
                    <h2 className="text-xl font-bold text-white">Homepage Notice Ticker</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Publish alerts to the cyber cafe portal marquee.</p>
                  </div>
                  <div className="space-y-3">
                    {notices.map(not => (
                      <div key={not.id} className="p-4 rounded-xl bg-slate-900/80 border border-slate-800 flex justify-between items-center">
                        <div>
                          <span className="text-xs font-semibold text-indigo-400">[{not.tag}]</span>
                          <h4 className="text-sm font-bold text-white mt-0.5">{not.title}</h4>
                          <p className="text-xs text-slate-400 mt-1">{not.content}</p>
                        </div>
                        <Badge variant={not.active ? 'emerald' : 'slate'}>{not.active ? 'Active' : 'Off'}</Badge>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Service Add/Edit Modal */}
          {isFormModalOpen && (
            <ServiceModalForm
              serviceToEdit={serviceToEdit}
              categories={INITIAL_CATEGORIES}
              onClose={() => setIsFormModalOpen(false)}
              onSave={handleSaveService}
            />
          )}

          {/* Service View Details Modal */}
          {viewingService && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
              <div className="bg-[#0f172a] border border-slate-700 rounded-2xl max-w-xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <Badge variant="indigo">{viewingService.category}</Badge>
                    <h3 className="text-lg font-bold text-white mt-1">{viewingService.name}</h3>
                    <span className="font-mono text-xs text-slate-400">ID: {viewingService.id}</span>
                  </div>
                  <button onClick={() => setViewingService(null)} className="text-slate-400 hover:text-white cursor-pointer"><Icons.X /></button>
                </div>
                <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-lg">{viewingService.description || viewingService.shortDescription}</p>
                <div className="flex justify-between text-xs text-slate-300">
                  <span>Fee: <strong className="text-emerald-400 font-bold">₹{viewingService.fee || 'Nominal'}</strong></span>
                  <span>TAT: {viewingService.processingTime || '1-2 Days'}</span>
                </div>
                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase mb-1">Required Documents</h4>
                  <ul className="text-xs text-slate-300 space-y-1">
                    {viewingService.documents?.map((d, i) => (
                      <li key={i} className="flex items-center gap-1.5"><Icons.Check /> {d}</li>
                    )) || <li>No document requirements listed.</li>}
                  </ul>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button onClick={() => setViewingService(null)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs cursor-pointer">Close</button>
                  <button onClick={() => { const s = viewingService; setViewingService(null); setServiceToEdit(s); setIsFormModalOpen(true); }} className="px-3 py-1.5 bg-indigo-600 text-white rounded text-xs cursor-pointer">Edit</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 animate-fadeIn">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    function ServiceModalForm({ serviceToEdit, categories, onClose, onSave }) {
      const isEditing = !!serviceToEdit;
      const [name, setName] = useState(serviceToEdit?.name || '');
      const [id, setId] = useState(serviceToEdit?.id || '');
      const [category, setCategory] = useState(serviceToEdit?.category || categories[1]);
      const [fee, setFee] = useState(serviceToEdit?.fee || '');
      const [processingTime, setProcessingTime] = useState(serviceToEdit?.processingTime || '1-2 Working Days');
      const [shortDescription, setShortDescription] = useState(serviceToEdit?.shortDescription || '');
      const [description, setDescription] = useState(serviceToEdit?.description || '');
      const [active, setActive] = useState(serviceToEdit?.active !== false);
      const [featured, setFeatured] = useState(!!serviceToEdit?.featured);
      const [docs, setDocs] = useState(serviceToEdit?.documents || ['Aadhaar Card', 'Photo']);
      const [docInput, setDocInput] = useState('');

      const handleAddDoc = () => {
        if (docInput.trim() && !docs.includes(docInput.trim())) {
          setDocs([...docs, docInput.trim()]);
          setDocInput('');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: id.trim(),
          name: name.trim(),
          category,
          fee: fee !== '' ? Number(fee) : null,
          processingTime,
          shortDescription,
          description,
          active,
          featured,
          documents: docs,
          keywords: ['service', 'online form']
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
          <div className="bg-[#0f172a] border border-slate-700 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
              <h3 className="text-base font-bold text-white">{isEditing ? 'Edit Service' : 'Add New Service'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><Icons.X /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 mb-1">Service Title *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => {
                      setName(e.target.value);
                      if (!isEditing) setId(e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''));
                    }}
                    className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white"
                  />
                </div>
                <div>
                  <label className="block text-slate-300 mb-1">Service ID / Slug *</label>
                  <input
                    type="text"
                    required
                    disabled={isEditing}
                    value={id}
                    onChange={(e) => setId(e.target.value)}
                    className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-slate-300 mb-1">Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white">
                    {categories.filter(c => c !== 'All Services').map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-300 mb-1">Fee (₹)</label>
                  <input type="number" value={fee} onChange={(e) => setFee(e.target.value)} placeholder="Nominal" className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white" />
                </div>
                <div>
                  <label className="block text-slate-300 mb-1">Turnaround Time</label>
                  <input type="text" value={processingTime} onChange={(e) => setProcessingTime(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white" />
                </div>
              </div>

              <div>
                <label className="block text-slate-300 mb-1">Short Description</label>
                <input type="text" value={shortDescription} onChange={(e) => setShortDescription(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white" />
              </div>

              <div>
                <label className="block text-slate-300 mb-1">Full Description</label>
                <textarea rows="2" value={description} onChange={(e) => setDescription(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded text-white" />
              </div>

              <div>
                <label className="block text-slate-300 mb-1">Required Documents</label>
                <div className="flex gap-2 mb-1.5">
                  <input type="text" value={docInput} onChange={(e) => setDocInput(e.target.value)} placeholder="Add document name..." className="flex-1 p-2 bg-slate-950 border border-slate-800 rounded text-white text-xs" />
                  <button type="button" onClick={handleAddDoc} className="px-3 py-1 bg-slate-800 text-slate-200 rounded cursor-pointer">Add</button>
                </div>
                <div className="flex flex-wrap gap-1.5 p-2 bg-slate-950 rounded border border-slate-800">
                  {docs.map((d, i) => (
                    <span key={i} className="px-2 py-0.5 bg-slate-800 rounded text-slate-200 flex items-center gap-1">
                      {d}
                      <button type="button" onClick={() => setDocs(docs.filter((_, idx) => idx !== i))} className="text-slate-400 hover:text-rose-400 cursor-pointer">×</button>
                    </span>
                  ))}
                </div>
              </div>

              <div className="flex gap-4 p-3 bg-slate-950 rounded border border-slate-800">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={active} onChange={(e) => setActive(e.target.checked)} className="rounded bg-slate-900" />
                  <span>Active in Portal</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={featured} onChange={(e) => setFeatured(e.target.checked)} className="rounded bg-slate-900" />
                  <span>Featured on Home ★</span>
                </label>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={onClose} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded cursor-pointer">Cancel</button>
                <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white rounded font-semibold cursor-pointer">Save Service</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
