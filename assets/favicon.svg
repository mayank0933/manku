<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b19" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#primaryGlow)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Subtle Cyber Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
  </g>

  <!-- Ambient Glow Behind M -->
  <circle cx="256" cy="256" r="130" fill="#3b82f6" opacity="0.15" filter="url(#glowFilter)" />

  <!-- Modern Geometric 'M' Emblem -->
  <g filter="url(#glowFilter)">
    <!-- Left Column -->
    <path d="M112 376 V176 L204 286 L256 220 L168 136 H112 C98.7 136 88 146.7 88 160 V376 C88 389.3 98.7 400 112 400 H128 C141.3 400 152 389.3 152 376 V252 L208 320 C216.5 330.3 231.5 330.3 240 320 L256 300 V376 C256 389.3 266.7 400 280 400 H288 C301.3 400 312 389.3 312 376" fill="none" />
    <!-- Clean Crisp Main Poly M -->
    <path d="M120 380 V156 C120 142.7 130.7 132 144 132 H164 C174.6 132 184.6 137.6 190.2 146.8 L256 254.4 L321.8 146.8 C327.4 137.6 337.4 132 348 132 H368 C381.3 132 392 142.7 392 156 V380 C392 386.6 386.6 392 380 392 H348 C341.4 392 336 386.6 336 380 V232 L277.2 328.6 C272.2 336.8 263.2 341.8 253.6 341.8 C244 341.8 235 336.8 230 328.6 L176 232 V380 C176 386.6 170.6 392 164 392 H132 C125.4 392 120 386.6 120 380 Z" fill="url(#primaryGlow)" />
  </g>

  <!-- Digital Connectivity Node / Accent Star -->
  <circle cx="256" cy="120" r="16" fill="url(#accentCyan)" />
  <circle cx="256" cy="120" r="28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />
  
  <circle cx="144" cy="132" r="8" fill="#ffffff" />
  <circle cx="368" cy="132" r="8" fill="#ffffff" />
  <circle cx="256" cy="256" r="9" fill="#ffffff" />
</svg>
